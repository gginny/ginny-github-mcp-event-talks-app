<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Day Technical Talks Event</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #0056b3;
            text-align: center;
        }
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-container input[type="text"] {
            padding: 10px;
            width: 70%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }
        .search-container button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .search-container button:hover {
            background-color: #0056b3;
        }
        .schedule-item {
            background-color: #e9ecef;
            border: 1px solid #dee2e6;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 5px;
        }
        .schedule-item.lunch {
            background-color: #ffeeba;
            border-color: #ffc107;
        }
        .schedule-item h3 {
            margin-top: 0;
            color: #333;
        }
        .schedule-item .time {
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 5px;
            display: block;
        }
        .schedule-item .speakers {
            font-style: italic;
            color: #555;
            margin-bottom: 5px;
        }
        .schedule-item .categories span {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .schedule-item p {
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tech Summit 2026</h1>
        <h2>Event Schedule</h2>

        <div class="search-container">
            <input type="text" id="categorySearch" placeholder="Search by category...">
            <button id="searchButton">Search</button>
            <button id="resetButton" style="margin-left: 10px;">Reset</button>
        </div>

        <div id="schedule">
            <!-- Schedule items will be dynamically loaded here -->
        </div>
    </div>

    <script>
        const talksData = [
            {
                title: "The Future of AI in Software Development",
                speakers: ["Dr. Evelyn Reed"],
                categories: ["AI", "Software Engineering"],
                duration: 60, // minutes
                description: "Exploring cutting-edge AI applications that are transforming the software development lifecycle, from automated code generation to intelligent debugging assistants."
            },
            {
                title: "Deep Dive into Modern Web Frameworks",
                speakers: ["Alex Chen", "Sarah Miller"],
                categories: ["Web Development", "Frontend"],
                duration: 60,
                description: "A comprehensive look at the latest trends and best practices in popular web development frameworks like React, Vue, and Angular."
            },
            {
                title: "Cloud Native Architectures with Kubernetes",
                speakers: ["Michael Jordan"],
                categories: ["Cloud", "DevOps", "Kubernetes"],
                duration: 60,
                description: "Understanding how to design and deploy scalable, resilient applications using Kubernetes and other cloud-native tools."
            },
            {
                title: "Cybersecurity Essentials for Developers",
                speakers: ["Jessica Lee"],
                categories: ["Security", "Development"],
                duration: 60,
                description: "Key security principles and practices every developer should know to build robust and secure applications."
            },
            {
                title: "Leveraging Data for Product Growth",
                speakers: ["David Wong"],
                categories: ["Data Science", "Product Management"],
                duration: 60,
                description: "Strategies for using data analytics and machine learning to inform product decisions and drive business growth."
            },
            {
                title: "Blockchain Beyond Crypto: Enterprise Applications",
                speakers: ["Emily White", "John Davis"],
                categories: ["Blockchain", "Enterprise"],
                duration: 60,
                description: "Discovering the practical applications of blockchain technology in various industries beyond cryptocurrencies."
            }
        ];

        const eventStartTime = new Date();
        eventStartTime.setHours(10, 0, 0, 0); // Event starts at 10:00 AM

        const TALK_DURATION = 60; // minutes
        const TRANSITION_TIME = 10; // minutes
        const LUNCH_DURATION = 60; // minutes
        const LUNCH_AFTER_TALK_INDEX = 3; // Lunch after the 4th talk (index 3)

        function calculateSchedule(talks) {
            let currentTime = new Date(eventStartTime);
            const scheduledItems = [];

            talks.forEach((talk, index) => {
                // Add talk
                const talkStart = new Date(currentTime);
                const talkEnd = new Date(talkStart.getTime() + TALK_DURATION * 60 * 1000);

                scheduledItems.push({
                    type: 'talk',
                    ...talk,
                    start_time: talkStart,
                    end_time: talkEnd
                });
                currentTime = new Date(talkEnd);

                // Add transition after each talk, except the last one
                if (index < talks.length - 1) {
                    currentTime = new Date(currentTime.getTime() + TRANSITION_TIME * 60 * 1000);
                }

                // Add lunch after the specified talk
                if (index === LUNCH_AFTER_TALK_INDEX) {
                    const lunchStart = new Date(currentTime);
                    const lunchEnd = new Date(lunchStart.getTime() + LUNCH_DURATION * 60 * 1000);
                    scheduledItems.push({
                        type: 'lunch',
                        title: 'Lunch Break',
                        start_time: lunchStart,
                        end_time: lunchEnd
                    });
                    currentTime = new Date(lunchEnd);
                    // Add transition after lunch, if it's not the last item
                    if (index < talks.length - 1) {
                         currentTime = new Date(currentTime.getTime() + TRANSITION_TIME * 60 * 1000);
                    }
                }
            });
            return scheduledItems;
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderSchedule(filteredTalks = talksData) {
            const scheduleContainer = document.getElementById('schedule');
            scheduleContainer.innerHTML = ''; // Clear previous schedule

            const scheduleItems = calculateSchedule(filteredTalks);

            scheduleItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.classList.add('schedule-item');
                if (item.type === 'lunch') {
                    itemDiv.classList.add('lunch');
                    itemDiv.innerHTML = `
                        <span class="time">${formatTime(item.start_time)} - ${formatTime(item.end_time)}</span>
                        <h3>${item.title}</h3>
                    `;
                } else {
                    itemDiv.innerHTML = `
                        <span class="time">${formatTime(item.start_time)} - ${formatTime(item.end_time)}</span>
                        <h3>${item.title}</h3>
                        <div class="speakers">Speakers: ${item.speakers.join(', ')}</div>
                        <div class="categories">
                            ${item.categories.map(cat => `<span>${cat}</span>`).join('')}
                        </div>
                        <p>${item.description}</p>
                    `;
                }
                scheduleContainer.appendChild(itemDiv);
            });
        }

        // Search functionality
        const searchInput = document.getElementById('categorySearch');
        const searchButton = document.getElementById('searchButton');
        const resetButton = document.getElementById('resetButton');

        searchButton.addEventListener('click', () => {
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                const filtered = talksData.filter(talk =>
                    talk.categories.some(cat => cat.toLowerCase().includes(searchTerm))
                );
                renderSchedule(filtered);
            } else {
                renderSchedule(); // Render all if search term is empty
            }
        });

        resetButton.addEventListener('click', () => {
            searchInput.value = '';
            renderSchedule();
        });

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', renderSchedule);
    </script>
</body>
</html>
